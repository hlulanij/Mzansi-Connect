# One-click deploy: Render > New > Blueprint > pick this repo. Free plan, preview mode.
# To launch for real: remove DEMO_SEED and ALLOW_MOCK_PAYMENTS, add the PEACH_* variables, and move to a paid
# instance with a disk mounted at /data (set DB_PATH=/data/data.sqlite) so seller accounts and orders survive restarts.
services:
  - type: web
    name: dropit-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL        # this site's own public address (card checkout page and webhooks use it)
        value: https://dropit-api.onrender.com
      - key: DEMO_SEED          # loads sample sellers and listings and shows the "Preview version" banner
        value: "1"
      - key: ALLOW_MOCK_PAYMENTS # no real charges; remove once Peach credentials are set
        value: "1"
      # Optional, shown on the Help, Terms and Privacy pages and in the footer:
      # - key: SUPPORT_EMAIL
      # - key: SUPPORT_PHONE
