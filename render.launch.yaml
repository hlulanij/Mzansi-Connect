# REAL LAUNCH (paid). Use this instead of render.yaml once you are ready for real sellers and buyers:
#   - a paid instance with a disk, so seller accounts, listings and orders survive restarts
#   - no sample data, no test payment button
#   - real card and EFT payments through Peach
# In Render: New > Blueprint > this repo > "Blueprint Path" = render.launch.yaml.
# Render asks you to type the values marked "sync: false". They are never stored in this repository.
services:
  - type: web
    name: dropit-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    branch: main
    healthCheckPath: /health
    disk:
      name: mzansiconnect-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://dropit-api.onrender.com
      - key: DB_PATH
        value: /data/data.sqlite
      - key: PEACH_ENV          # keep "sandbox" until Peach's sandbox tests pass, then change to "live"
        value: sandbox
      - key: PEACH_CLIENT_ID
        sync: false
      - key: PEACH_CLIENT_SECRET
        sync: false
      - key: PEACH_MERCHANT_ID
        sync: false
      - key: PEACH_ENTITY_ID
        sync: false
      - key: PEACH_WEBHOOK_SECRET
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
